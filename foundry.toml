[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_KEY}", url = "https://api-testnet.monadscan.com/api", chain = 10143 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.security]
# Heavier fuzz + invariant campaigns for local security sweeps.
# CI can keep default settings for speed.

[profile.security.fuzz]
runs = 2000

[profile.security.invariant]
runs = 512
depth = 1000
