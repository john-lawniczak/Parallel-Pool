[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Required for Sourcify verification (MonadVision)
extra_output = ["metadata"]
metadata = true
metadata_hash = "none"
use_literal_content = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
# BlockVision premium RPC (faster)
monad_blockvision = "https://monad-mainnet.blockvision.org/v1/${BLOCKVISION_API_KEY}"

[etherscan]
# Etherscan API v2 (multichain) - single key works for all supported chains
monad_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=143", chain = 143 }
monad_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=10143", chain = 10143 }
# SocialScan (no API key required)
monad_socialscan = { key = "", url = "https://api.socialscan.io/monad-mainnet/v1/explorer/command_api/contract", chain = 143 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[profile.security]
# Heavier fuzz + invariant campaigns for local security sweeps.
# CI can keep default settings for speed.

[profile.security.fuzz]
runs = 2000

[profile.security.invariant]
runs = 512
depth = 1000
